appId: com.fastnxt.pos
productName: FastNxt POS
copyright: Copyright © FastNxt
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: dist-electron
  buildResources: assets

files:
  - src/**/*
  - assets/**/*
  - package.json
  - "!**/*.map"

asar: true
# sql.js loads WASM from node_modules at runtime (must not stay inside asar only).
asarUnpack:
  - node_modules/sql.js/**/*

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FastNxt POS
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico

mac:
  icon: assets/icon.png
  category: public.app-category.business
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  hardenedRuntime: true
  gatekeeperAssess: false

linux:
  icon: assets/icon.png
  category: Office
  target:
    - AppImage
    - deb
  executableName: fastnxt-pos

publish: null
